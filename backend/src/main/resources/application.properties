spring.application.name=nifty50-analyzer

# Server
server.port=8080

# Logging
logging.level.com.nifty50=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cache=INFO

# Jackson - preserve JSON field names as-is
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Caffeine Cache — TTL 60s for index, 30s for quotes
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=30s

# Scheduler enabled
spring.task.scheduling.pool.size=3

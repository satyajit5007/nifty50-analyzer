# ─── Production Profile (Railway / Render) ────────────────────────
# Activated with: -Dspring.profiles.active=prod
# Or Railway sets: SPRING_PROFILES_ACTIVE=prod

spring.application.name=nifty50-analyzer

# Port — Railway injects $PORT automatically
server.port=${PORT:8080}

# Logging — less verbose in prod
logging.level.com.nifty50=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.cache=WARN

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Caffeine Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=30s

# Scheduler
spring.task.scheduling.pool.size=3

# CORS Allowed Origins (overridable via environment variable)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
